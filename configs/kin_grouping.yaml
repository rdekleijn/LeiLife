# Real experiment, half 1 of 2: does group structure shape the signaling
# conventions that evolve and get culturally transmitted? Run alongside
# configs/mixed_grouping.yaml -- same parameters and seed, differing only
# in kin_based_groups -- then compare with
# examples/compare_kin_vs_mixed.py. See examples/README.md.

name: kin_grouping

num_agents: 100
num_gens: 500
lifetime: 1000
env_size: 50
group_size: 5
kin_based_groups: true

n_hidden: 8
top_n: 20
offspring_per: 5
mutation_std: 0.3

signaling: true
social_learning: true

seed: 42
num_cores: null

save_best_every: 25
save_all_groups_every: 100
checkpoint_every: 50
resume_from: null
